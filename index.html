<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="PDF Converter Toolkit — convert text-based PDFs to Excel and Word entirely in your browser. No uploads, no servers, no AI APIs." />
    <title>PDF Converter Toolkit — Private PDF to Excel &amp; Word</title>
    <script>
      // Apply the theme before first paint to avoid a flash of the wrong theme.
      try {
        var stored = localStorage.getItem("pct-theme");
        var dark = stored ? stored === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (dark) document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
